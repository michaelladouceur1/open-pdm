[package]
name = "open-pdm-app"
version = "0.1.0"
edition = "2021"
description = "OpenPDM desktop application (Tauri host)"

# Standalone workspace: kept out of the root Cargo workspace so `cargo test`
# at the repo root does not try to compile the GUI (which needs a frontend
# bundle present at compile time).
[workspace]

[lib]
name = "open_pdm_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open-pdm-core = { path = "../../../crates/core" }
