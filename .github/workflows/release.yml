name: Release

# Build the desktop installers and attach them to a GitHub Release.
#
# Triggers:
#   - pushing a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`)
#   - manual runs via the "Run workflow" button (supply the release tag)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

# tauri-action needs write access to create the release and upload assets.
permissions:
  contents: write

# Never let two release runs fight over the same release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.label }} installers
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Tauri bundles must be built on their target OS; there is no
          # Linux -> Windows cross-compile.
          - os: windows-latest
            label: Windows
            bundles: msi,nsis
          - os: ubuntu-22.04
            label: Linux
            bundles: deb,appimage

    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4

      # Tauri's Linux build needs the GTK/WebKit/DBus dev headers.
      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev libdbus-1-dev \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # src-tauri is its own workspace, so point the cache at it.
          workspaces: apps/desktop/src-tauri

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      # Compiles the frontend + Rust host and produces the installers, then
      # creates/updates the release and uploads the bundles for this platform.
      # Both matrix jobs target the same tag, so their assets land on one release.
      - name: Build and publish installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ steps.release.outputs.tag }}
          releaseName: "${{ steps.release.outputs.tag }}"
          releaseBody: "Download the installer for your platform from the assets below."
          # Set to false to publish the release immediately instead of as a draft.
          releaseDraft: true
          prerelease: false
          args: --bundles ${{ matrix.bundles }}
